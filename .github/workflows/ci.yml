name: VoltPulse Energy Lakehouse CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Power Grid Ingestion
      run: |
        python ingest_engine/ingest_grid_data.py

    - name: Run Battery Arbitrage & Time-Series Models
      run: |
        python models/arbitrage_analysis.py

    - name: Run Automated Data Quality Tests
      run: |
        pytest tests/ -v
